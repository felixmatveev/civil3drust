[package]
name = "civil3drust-workbench"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false
description = "DWG research app: view, inspect (hex/RON) and edit drawings with civil3drust (D-073)"

[workspace]

[dependencies]
civil3drust = { path = ".." }
acadrust = "0.6.7"
eframe = "0.37.0"
rfd = "0.17.2"
ron = "0.10"

# Dependencies built optimised once; our own code stays fast to rebuild
# (docs/workbench.md, "Build time").
[profile.dev.package."*"]
opt-level = 2
